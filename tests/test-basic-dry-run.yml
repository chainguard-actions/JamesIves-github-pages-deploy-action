name: Test basic dry-run deployment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create deployment folder
        run: |
          mkdir -p /tmp/deploy-output
          echo "<html><body>Hello World</body></html>" > /tmp/deploy-output/index.html
          echo "test content" > /tmp/deploy-output/test.txt

      - name: Set up git remote reachable inside the action
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: deploy
        uses: .
        with:
          folder: /tmp/deploy-output
          branch: gh-pages
          dry-run: true
          git-config-name: "Test User"
          git-config-email: "test@example.com"
          token: ${{ github.token }}
        continue-on-error: true

      - name: Assert deployment status output
        env:
          STATUS: ${{ steps.deploy.outputs.deployment-status }}
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deployment-status: $STATUS"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$STATUS" = "success" ] || [ "$STATUS" = "skipped" ]; then
              echo "PASS: deployment-status is '$STATUS'"
            else
              echo "FAIL: expected deployment-status to be 'success' or 'skipped', got '$STATUS'"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or dry-run limitation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
