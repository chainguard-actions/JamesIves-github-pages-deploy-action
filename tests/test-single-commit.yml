name: Test single-commit deployment mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create deployment folder
        run: |
          mkdir -p "$GITHUB_WORKSPACE/public"
          echo "<html><body>Single Commit Deploy</body></html>" > "$GITHUB_WORKSPACE/public/index.html"
          echo "v1.0.0" > "$GITHUB_WORKSPACE/public/version.txt"

      - id: deploy
        uses: .
        with:
          token: ${{ github.token }}
          branch: gh-pages
          folder: public
          single-commit: true
          dry-run: true
          git-config-name: "Deploy Bot"
          git-config-email: "deploy@example.com"
        continue-on-error: true

      - name: Assert deployment status output
        env:
          STATUS: ${{ steps.deploy.outputs.deployment-status }}
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deployment-status: $STATUS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$STATUS" ]; then
              echo "FAIL: action succeeded but deployment-status output is empty"
              exit 1
            fi
            if [ "$STATUS" != "success" ] && [ "$STATUS" != "skipped" ]; then
              echo "FAIL: expected deployment-status to be 'success' or 'skipped', got '$STATUS'"
              exit 1
            fi
            echo "PASS: deployment-status=$STATUS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
