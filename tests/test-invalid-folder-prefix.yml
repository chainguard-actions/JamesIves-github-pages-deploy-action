name: Test deployment fails with invalid folder prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_ACTOR: test-actor
      GITHUB_SHA: abc1234567890abcdef1234567890abcdef12345
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: fake-token-for-testing
          BRANCH: gh-pages
          FOLDER: ./build
          # FOLDER starts with './' which is invalid per the action's validation

      - name: Assert DEPLOYMENT_STATUS is failed due to invalid folder prefix
        run: |
          echo "DEPLOYMENT_STATUS: $DEPLOYMENT_STATUS"
          if [ "$DEPLOYMENT_STATUS" = "failed" ]; then
            echo "PASS: deployment correctly failed when folder has invalid './' prefix"
          else
            echo "FAIL: expected 'failed' but got '$DEPLOYMENT_STATUS'"
            exit 1
          fi
