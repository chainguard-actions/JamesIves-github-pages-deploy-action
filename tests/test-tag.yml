name: Test tag input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create deploy folder
        run: |
          mkdir -p /tmp/deploy-tag
          echo "<h1>Tag Test</h1>" > /tmp/deploy-tag/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          folder: /tmp/deploy-tag
          branch: gh-pages-tag-test
          tag: v0.1-test
          dry-run: true
          git-config-name: "Test User"
          git-config-email: "test@example.com"

      - name: Assert deployment ran or failed gracefully
        env:
          STATUS: ${{ steps.action.outputs.deployment-status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deployment-status: $STATUS"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$STATUS" != "success" ] && [ "$STATUS" != "skipped" ]; then
              echo "FAIL: unexpected deployment-status '$STATUS'"
              exit 1
            fi
            echo "PASS: deployment-status is '$STATUS' with tag input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
