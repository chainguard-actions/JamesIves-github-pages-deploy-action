name: Test ssh-key input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create deployment folder
        run: |
          mkdir -p /tmp/deploy-ssh
          echo "<h1>SSH Deploy Test</h1>" > /tmp/deploy-ssh/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Setting ssh-key to 'true' enables SSH endpoints without configuring the client
          ssh-key: "true"
          folder: /tmp/deploy-ssh
          branch: gh-pages-ssh-test
          dry-run: true
          git-config-name: "Test User"
          git-config-email: "test@example.com"

      - name: Assert action ran with ssh-key input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STATUS: ${{ steps.action.outputs.deployment-status }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deployment-status: $STATUS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$STATUS" ]; then
              echo "FAIL: action succeeded but deployment-status is empty"
              exit 1
            fi
            echo "PASS: ssh-key mode ran successfully with status '$STATUS'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or SSH limitation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
