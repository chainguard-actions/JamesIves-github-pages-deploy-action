name: Test ACCESS_TOKEN and SILENT inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create deploy folder
        run: mkdir -p /tmp/deploy-output && echo "hello" > /tmp/deploy-output/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          ACCESS_TOKEN: ${{ github.token }}
          BRANCH: gh-pages
          FOLDER: /tmp/deploy-output
          SILENT: 'true'

      - name: Assert action ran with ACCESS_TOKEN and SILENT inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STATUS: ${{ steps.action.outputs.DEPLOYMENT_STATUS }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deployment_status: $STATUS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$STATUS" ]; then
              echo "FAIL: action succeeded but DEPLOYMENT_STATUS is empty"
              exit 1
            fi
            echo "PASS: got status '$STATUS'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
