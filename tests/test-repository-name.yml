name: Test repository-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create deploy folder
        run: |
          mkdir -p /tmp/deploy-repo
          echo "<h1>Repo Name Test</h1>" > /tmp/deploy-repo/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          folder: /tmp/deploy-repo
          branch: gh-pages-repo-test
          dry-run: true
          repository-name: JamesIves/github-pages-deploy-action
          git-config-name: "Test User"
          git-config-email: "test@example.com"

      - name: Assert deployment ran or failed gracefully
        env:
          STATUS: ${{ steps.action.outputs.deployment-status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deployment-status: $STATUS"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$STATUS" != "success" ] && [ "$STATUS" != "skipped" ]; then
              echo "FAIL: unexpected deployment-status '$STATUS'"
              exit 1
            fi
            echo "PASS: deployment-status is '$STATUS' with custom repository-name"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected when targeting external repo without write access)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
