name: Test repository-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create deploy folder
        run: mkdir -p /tmp/deploy-content && echo "hello" > /tmp/deploy-content/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          folder: /tmp/deploy-content
          branch: gh-pages
          repository-name: JamesIves/github-pages-deploy-action
          dry-run: true
          token: ${{ github.token }}

      - name: Assert action ran with repository-name input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STATUS: ${{ steps.action.outputs.deployment-status }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deployment-status: $STATUS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$STATUS" ]; then
              echo "FAIL: action succeeded but deployment-status is empty"
              exit 1
            fi
            echo "PASS: action succeeded with status '$STATUS'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel/cross-repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
