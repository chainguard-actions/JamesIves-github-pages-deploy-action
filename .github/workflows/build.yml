name: Unit Tests 🧪
on:
  pull_request:
    branches:
      - 'dev*'
      - 'releases/v*'
  push:
    branches:
      - '*'
    tags-ignore:
      - '*.*'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install and Test
        run: |
          yarn install --frozen-lockfile
          yarn lint:check
          yarn lint:format:check
          yarn test

      - name: Uploade CodeCov Report
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Build lib
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Rebuild production node_modules
        run: |
          yarn install --production --frozen-lockfile
          ls node_modules

      - name: artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist
          path: |
            lib
            node_modules

  integration:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        branch: ['gh-pages', 'no-pages']
        commit: ['singleCommit', 'add commits']
      max-parallel: 1
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'

      - name: Download artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist

      - name: Deploy
        id: unmodified
        uses: ./
        with:
          folder: integration
          branch: ${{ matrix.branch }}
          single-commit: ${{ matrix.commit == 'singleCommit' }}
          dry-run: true

      # Usually, this should be skipped, but if the upstream gh-pages
      # branch doesn't match ours, it should still be a success.
      - name: Check step output
        env:
          DEPLOYMENT_STATUS: ${{ steps.unmodified.outputs.deployment-status }}
        run: |
          [[ \
          "$DEPLOYMENT_STATUS" = skipped || \
          "$DEPLOYMENT_STATUS" = success \
          ]]

      - name: Tweak content to publish to existing branch
        if: ${{ matrix.branch == 'gh-pages' }}
        run: |
          echo "<!-- just sayin -->" >> integration/index.html

      - name: Deploy with modifications to existing branch
        id: modified
        uses: ./
        if: ${{ matrix.branch == 'gh-pages' }}
        with:
          folder: integration
          branch: ${{ matrix.branch }}
          single-commit: ${{ matrix.commit == 'singleCommit' }}
          dry-run: true

      # The modified deployment should be a success, and not skipped.
      - name: Check step output
        if: ${{ matrix.branch == 'gh-pages' }}
        env:
          DEPLOYMENT_STATUS: ${{ steps.modified.outputs.deployment-status }}
        run: |
          [[ \
          "$DEPLOYMENT_STATUS" = success \
          ]]
